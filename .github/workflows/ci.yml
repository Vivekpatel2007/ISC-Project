name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  backend:
    name: Backend tests (Python 3.11, CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PULMOSCAN_DEVICE: cpu
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-local.txt
            requirements/compute-cpu.txt

      - name: Install CPU PyTorch and backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/compute-cpu.txt --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -c constraints-local.txt -c requirements/compute-cpu.txt

      - name: Check dependency compatibility and CPU profile
        run: |
          python -m pip check
          python -c "import torch; assert torch.version.cuda is None, 'CI must use CPU-only PyTorch'; print('PyTorch:', torch.__version__)"

      - name: Run isolated backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests, lint and build (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root and frontend dependencies from lockfiles
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Check Turborepo task configuration without starting services
        run: npm run dev:plan

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Build frontend and check TypeScript
        run: npm --prefix frontend run build
